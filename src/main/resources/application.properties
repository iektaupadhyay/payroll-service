spring.application.name=payroll-service

# ==========================================
# DATABASE CONFIGURATION
# ==========================================

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA CONFIGURATION
# ==========================================

spring.jpa.hibernate.ddl-auto=update

# Avoid keeping Hibernate sessions open during HTTP response serialization.
spring.jpa.open-in-view=false

# Do not print SQL directly to the console.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ==========================================
# LOGGING CONFIGURATION
# ==========================================

logging.level.root=INFO

logging.level.com.employee_managemet.payroll_service=INFO

logging.level.org.springframework.web=INFO

logging.level.org.springframework.web.client=INFO

logging.level.org.hibernate.SQL=WARN

logging.level.org.hibernate.orm.jdbc.bind=WARN

# Correlation ID in every log line
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{correlationId:-N/A}] %logger{36} - %msg%n

# ==========================================
# EMPLOYEE SERVICE INTEGRATION
# ==========================================

employee.service.base-url=${EMPLOYEE_SERVICE_URL:http://localhost:8081}